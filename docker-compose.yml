services:
  vpn:
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      VPN_SERVICE_PROVIDER: surfshark
      VPN_TYPE: wireguard
      VERSION_INFORMATION: "off"
    restart: unless-stopped

  bot:
    build: .
    restart: unless-stopped
    init: true
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    env_file: .env
    command: >
      sh -c "node src/index.js bot -c ${CURRENT_DATE:?CURRENT_DATE must be set
      in .env} -t \"${TARGET_DATE}\" -m \"${MIN_DATE}\" ${DRY_RUN_FLAG}"
